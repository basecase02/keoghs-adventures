name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing gets more access than it needs; each job asks for its own.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Actions are pinned to exact commits (not moving tags), so a hijacked tag can't change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      # exact versions from the lockfile; install scripts off so a bad package can't run code on the build machine
      - run: npm ci --ignore-scripts
      # stop the deploy if a high or critical vulnerability is known
      - run: npm audit --omit=dev --audit-level=high
      # builds the site, then swaps the script policy for strict hashes (fails if anything is left open)
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
